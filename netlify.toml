[build]
  publish = "."
  # Static site: explicit no-op so it overrides any build command set in the Netlify UI.
  command = "echo 'Static site - no build step'"
  functions = "netlify/functions"

[[redirects]]
  from = "/assets/videos/*"
  to = "https://media.githubusercontent.com/media/senarzuniga/ingesite.github.io/main/assets/videos/:splat"
  status = 302
  force = true

# Netlify does not resolve Git LFS pointers, so serve video binaries from GitHub media.
[[redirects]]
  from = "/public/videos/*.mp4"
  to = "https://media.githubusercontent.com/media/senarzuniga/ingesite.github.io/main/assets/videos/:splat.mp4"
  status = 302
  force = true

# Keep Netlify as a live mirror of the canonical GitHub Pages deployment.
# The forced proxy prevents independent deploy contents from drifting while
# preserving the ingesitehub.netlify.app URL for visitors.
[[redirects]]
  from = "/"
  to = "https://senarzuniga.github.io/ingesite.github.io/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "https://senarzuniga.github.io/ingesite.github.io/:splat"
  status = 200
  force = true

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Disposition = "inline"

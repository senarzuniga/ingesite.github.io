[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

[[redirects]]
  from = "/assets/videos/*"
  to = "https://media.githubusercontent.com/media/senarzuniga/ingesite.github.io/main/assets/videos/:splat"
  status = 302
  force = true

[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Disposition = "inline"

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Product Brochure May 2026</title>
  <style>
    @page {
      size: A4;
      margin: 16mm;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #111;
      background: #fff;
    }

    .sheet {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 16mm;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      letter-spacing: 0.04em;
    }

    p {
      margin: 0 0 10px;
      font-size: 14px;
      line-height: 1.45;
    }

    .qr {
      width: 320px;
      height: 320px;
      object-fit: contain;
      display: block;
      margin: 18px auto;
      border: 10px solid #fff;
      box-shadow: 0 0 0 1px #ddd;
    }

    .url {
      margin-top: 8px;
      font-size: 12px;
      word-break: break-all;
    }

    .note {
      margin-top: 14px;
      font-size: 12px;
      color: #444;
    }
  </style>
</head>
<body>
  <main class="sheet">
    <h1>ING_DIGHUB</h1>
    <p>QR de acceso al Product Brochure May 2026</p>
    <img class="qr" src="product-brochure-may-2026.png" alt="QR Product Brochure May 2026">
    <p class="url">https://senarzuniga.github.io/ingesite.github.io/public/docs/product-brochure-may-2026.pdf</p>
    <p class="note">Al escanear, podras abrir el documento en linea o descargarlo.</p>
  </main>
</body>
</html>

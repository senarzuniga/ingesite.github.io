name: Deploy Netlify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out static site without LFS downloads
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Deploy shared site source to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 09d42218-5271-4fd6-887c-3373edc4e307
        run: >
          npx --yes netlify-cli@26.0.2 deploy
          --prod
          --dir .
          --site "$NETLIFY_SITE_ID"
          --message "GitHub ${GITHUB_SHA}"
